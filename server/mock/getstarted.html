<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Get Started</h1>
        <form id="signupForm">
            <label for="email">when u born:</label>
            <input type="date" id="born" name="born">
            <br><br>
            <label for="goal">what is your goal:</label>
            <select id="goal" name="goal" multiple>
                <option value="planning">Date Planning</option>
                <option value="personal">Personal Use</option>
                <option value="social">Social Use</option>
                <option value="vacation">Vacation Planning</option>
            </select>
            <br><br>
            <label for="source">How did you hear about us:</label>
            <select id="source" name="source">
                <option value="friend">Friend</option>
                <option value="social_media">Social Media</option>
                <option value="search_engine">Search Engine</option>
                <option value="other">Other</option>
            </select>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    <script>
        async function signupProcess() {
            const form = document.querySelector("#signupForm");
            const formData = new FormData(form);
            const data = {
                born: formData.get('born'),
                goal: formData.getAll('goal'),
                source: formData.get('source'),
                name: formData.get('name'),
                email: formData.get('email'),
                password: formData.get('password')
            };

            try {
                await submitSurvey({
                    born: data.born,
                    goal: data.goal,
                    source: data.source
                })
            } catch (err) {
                alert(err.message);
                return;
            }

            await signup({
                email: data.email,
                password: data.password,
                name: data.name
            });

            alert("Signup successful! You can now sign in.");
            window.location.href = 'signin.html';
        }

        async function submitSurvey(data) {
            try {
                const res = await fetch('/api/users/source-survey', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    throw new Error('Survey failed');
                }
                alert('Survey recieved!');
            } catch (err) {
                alert(err.message);
            }
        }

        async function signup(data) {
            try {
                const res = await fetch('/api/users/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    throw new Error('Signup failed');
                }
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
